# PJRC Teensy 4.1 (i.MX RT1062) + Ethernet kit + APS6404L PSRAM
CONFIG_BUILD_OUTPUT_HEX=y
    # Teensy is flashed with zephyr.hex through the HalfKay bootloader (teensy_loader_cli)
CONFIG_SPI=n
    # Native ENET Ethernet; no SPI peripherals
CONFIG_ENTROPY_GENERATOR=y
    # On-chip TRNG seeds the network stack
CONFIG_MEMC=y
    # FlexSPI2 APS6404L PSRAM (boards/teensy41.overlay)
CONFIG_ETH_NXP_ENET_HW_ACCELERATION=y
    # T4 trial: ENET checksum insertion corrupted the IPv4 header checksum of outgoing *fragments*; nothing fragments now

# WAD filesystem: LittleFS partition in the upper part of the W25Q64 program flash (boards/teensy41.overlay)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=2
# File caches come from a heap sized from CACHE_SIZE; it must match the fstab cache-size (256) or fs_open fails -ENOMEM
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=2048
CONFIG_USE_DT_CODE_PARTITION=y
    # Link the image into slot0_partition so it cannot overlap the WAD partition
CONFIG_FLASH_LOG_LEVEL_OFF=y
    # The flash driver runs from ITCM while the XIP flash is busy; logging from there is unsafe
CONFIG_FS_LOG_LEVEL_INF=y
CONFIG_MEMC_LOG_LEVEL_INF=y
