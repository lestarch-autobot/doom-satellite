#################################
#### F Prime: Dependencies   ####
####     Required by F Prime ####
#################################
CONFIG_CPP=y
    # F Prime requires CPP...
CONFIG_REQUIRES_FULL_LIBCPP=y
    # ...in full capacity
CONFIG_STD_CPP14=y
    # F Prime requires C++14
CONFIG_COMMON_LIBC_MALLOC=y
    # LIBC malloc calls are needed for Fw::MemAllocator
CONFIG_DYNAMIC_THREAD=y
    # Threads are built at runtime...
CONFIG_DYNAMIC_THREAD_ALLOC=n
    # ...not through dynamic allocation...
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
    # ...but by a preallocated pool
CONFIG_THREAD_STACK_INFO=y
    # Required by CONFIG_DYNAMIC_THREAD on some systems
CONFIG_KERNEL_MEM_POOL=y
    # Kernel has its own memory pool
CONFIG_REBOOT=y
    # Fatal handler uses reboot
CONFIG_RING_BUFFER=y
    # Ring buffer is used by the UART driver

###################################################################
#### F Prime: tunable options                                  ####
####     Required by F Prime, values determined by application ####
###################################################################
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
    # By default we give all stacks for all threads (active components, user threads) 8KiB.
    # Experimentation has shown that this can be made as little as 4KiB without errors.
    #
    # CAUTION: this must be exactly equal to every thread stack size in the system.
    #
    # TIP: this will manifest as an ASSERTION failure in ActiveComponentBase when inconsistent.
CONFIG_MAIN_STACK_SIZE=8192
    # ...and we keep the main stack consistent with 8KiB
CONFIG_DYNAMIC_THREAD_POOL_SIZE=16
    # 13 active components (frameHandoff, frameStreamer added) + 2 Drv.Udp threads + 1 spare; each pool slot costs 8KiB of static RAM.
    #
    # CAUTION: Make sure that this is >= the number of active components + user threads in the system.
    #
    # TIP: this will manifest as an ASSERTION failure in ActiveComponentBase when inconsistent.
CONFIG_ASSERT=y
    # F Prime FW_ASSERT requires asserts. This can be turned off when FW_ASSERT is turned off.
CONFIG_CPP_EXCEPTIONS=n
    # F Prime typically disables CPP exceptions as this is flight practice.
CONFIG_CPP_RTTI=n
    # F Prime typically disables RTTI as this is flight practice.
CONFIG_FILE_SYSTEM=y
    # Enable file system support. This can be disabled, however; the Os_File selection would need to be
    # set to Os_File_Stub

#########################################
#### Application: USB UART console   ####
#########################################
CONFIG_CONSOLE=y
    # Enable the Zephyr console
CONFIG_SERIAL=y
    # Enable Zephyr Serial support
CONFIG_UART_CONSOLE=y
    # Enable UART console
CONFIG_USB_DEVICE_STACK_NEXT=y
    # Use modern USBD stack
CONFIG_USBD_CDC_ACM_CLASS=y
    # Configure USBD to only support CDC ACM UART
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
    # Enabled at boot time
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
    # Initialized at boot time
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="DoomFlight"
    # CDC ACM description string
CONFIG_CDC_ACM_SERIAL_PID=0x0F03
    # USB Product ID: 0x0F03 for DoomFlight (0x0F01/0x0F02 are the LoRa radios on the same host)
    #     CAUTION: these IDs are intended for development only
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
    # USB Vendor ID: Zephyr project development VID
    #     CAUTION: these IDs are intended for development only
CONFIG_HWINFO=y
    # USB serial number is the chip unique ID, used for stable udev names

#########################################
#### Application: Device support     ####
#########################################
CONFIG_GPIO=y
    # Enable generic GPIO driver, used in reference
CONFIG_PWM=n
    # Disable PWM, not used in reference
CONFIG_I2C=n
    # Disable I2C, not used in reference
CONFIG_PINCTRL=y
    # Enable pin control.

#########################################
#### Application: Feature support    ####
#########################################
CONFIG_PRINTK=y
    # Enable printk, useful for debugging
CONFIG_THREAD_NAME=y
    # Thread names appear in fatal error reports

#################################
# USB CDC ACM touch reset into the bootloader (Zephyr.ZephyrTouchReset)
#################################
CONFIG_UART_LINE_CTRL=y
    # Required to read the host-selected CDC ACM baud rate
    # Bootloader entry is board specific: see boards/<board>.conf

#################################
# Networking: static IPv4, UDP sockets for Drv.Udp. The Ethernet device is board specific (boards/<board>.overlay)
#################################
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
    # Drv.Ip sockets set SO_SNDTIMEO on open
CONFIG_NET_CONTEXT_RCVTIMEO=y
    # Drv.Ip receive loops rely on SO_RCVTIMEO
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
    # POSIX socket names and headers used by Drv/Ip
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.11.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.11.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.11.1"
CONFIG_NET_IPV4_FRAGMENT=y
    # Packed DOOM frames (about 4 KB with the hub header) cross the hub as one fragmented UDP datagram
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=2
CONFIG_NET_IPV4_FRAGMENT_MAX_PKT=4
# One net_buf per Ethernet frame (1514 B fits a 1536 B buffer): the frame streamer's 46 datagrams/frame then cost one
# packet + one buffer each, and the TX pools hold two full frames (one in flight, one being queued). The buffer data
# arrays live in PSRAM (psram_sections.ld); the ENET driver copies through its own DMA buffers.
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_ETH_NXP_ENET_TX_BUFFERS=8
CONFIG_NET_TC_TX_COUNT=1
    # Transmit from the net TX thread: a sendto only enqueues, so a stalled ENET link blocks that thread, not the sender
    # One TX descriptor (the default) serializes every frame-stream chunk behind the previous transmit completion
    # Two reassembled frames in flight each way: ~32 128-byte data buffers per frame
# DIAGNOSTIC (temporary): boot logs for Ethernet bring-up
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=1
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_LOG_BUFFER_SIZE=8192
